<svg width="960" height="440" viewBox="260 250 960 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kernelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="52%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g transform="translate(310 290)" filter="url(#softShadow)">
    <path d="M170 20 L320 105 L320 275 L170 360 L20 275 L20 105 Z"
          fill="none" stroke="url(#kernelGrad)" stroke-width="10" filter="url(#glow)"/>

    <path d="M170 55 L290 123 L290 257 L170 325 L50 257 L50 123 Z"
          fill="rgba(255,255,255,0.03)" stroke="url(#kernelGrad)" stroke-width="4" opacity="0.9"/>

    <path d="M170 90 L260 142 L260 238 L170 290 L80 238 L80 142 Z"
          fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.55"/>

    <circle cx="130" cy="155" r="18" fill="#111827" stroke="#00e5ff" stroke-width="7"/>
    <circle cx="170" cy="125" r="24" fill="#111827" stroke="#67e8f9" stroke-width="8"/>
    <circle cx="235" cy="165" r="15" fill="#111827" stroke="#8b5cf6" stroke-width="6"/>
    <circle cx="245" cy="220" r="15" fill="#111827" stroke="#a78bfa" stroke-width="6"/>

    <path d="M130 173 L130 245" stroke="#00e5ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M170 149 L170 270" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
    <path d="M145 220 L205 220 L235 180" stroke="#8b5cf6" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M190 245 L245 220" stroke="#a78bfa" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(650 385)">
    <text x="0" y="0"
          font-family="Orbitron, Montserrat, Arial, sans-serif"
          font-size="112"
          font-weight="800"
          letter-spacing="-3"
          fill="#f8fafc"
          stroke="#111827"
          stroke-width="2">
      Kernel<tspan fill="#8b5cf6">IA</tspan>
    </text>

    <text x="5" y="72"
          font-family="Orbitron, Montserrat, Arial, sans-serif"
          font-size="36"
          font-weight="600"
          letter-spacing="8"
          fill="#38bdf8">
      BY HACKTECK
    </text>
  </g>
</svg>
