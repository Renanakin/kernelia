services:
  ollama:
    image: ollama/ollama:latest
    container_name: kernelia-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_FLASH_ATTENTION=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  openai-proxy:
    image: python:3.11-slim
    container_name: kernelia-openai-proxy
    working_dir: /app
    command: sh -c "pip install --no-cache-dir fastapi uvicorn httpx ; uvicorn ollama_proxy:app --host 0.0.0.0 --port 11435"
    volumes:
      - ./:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma3
      - OLLAMA_TIMEOUT_SECONDS=120
      - OLLAMA_RETRIES=1
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_DEFAULT_TEMPERATURE=0.6
      - OLLAMA_DEFAULT_MAX_TOKENS=500
      - OLLAMA_MAX_TOKENS_CAP=1200
      - OLLAMA_TOP_P=0.9
      - OLLAMA_NUM_THREAD=6
      - OLLAMA_NUM_CTX=4096
      - OLLAMA_PARALLELISM=2
    ports:
      - "11435:11435"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
