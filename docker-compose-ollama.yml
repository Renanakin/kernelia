services:
  ollama:
    image: ollama/ollama:latest
    container_name: kernelia-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=1          # Reduce a 1 para menos memoria simultánea
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=1m            # Reduce a 1m para descargar modelo inactivo rápido
      - OLLAMA_FLASH_ATTENTION=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '2'                     # Limita a 2 CPUs
          memory: 2G                    # Limita RAM a 2GB
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  openai-proxy:
    image: python:3.11-slim
    container_name: kernelia-openai-proxy
    working_dir: /app
    command: sh -c "pip install --no-cache-dir fastapi uvicorn httpx ; uvicorn ollama_proxy:app --host 0.0.0.0 --port 11435 --workers 1"
    volumes:
      - ./:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma:2b
      - OLLAMA_TIMEOUT_SECONDS=120
      - OLLAMA_RETRIES=1
      - OLLAMA_KEEP_ALIVE=1m            # Reduce keep-alive a 1m
      - OLLAMA_DEFAULT_TEMPERATURE=0.6
      - OLLAMA_DEFAULT_MAX_TOKENS=300   # Reduce max tokens (de 500 a 300)
      - OLLAMA_MAX_TOKENS_CAP=800       # Reduce cap (de 1200 a 800)
      - OLLAMA_TOP_P=0.9
      - OLLAMA_NUM_THREAD=4             # Reduce threads (de 6 a 4)
      - OLLAMA_NUM_CTX=2048             # Reduce contexto (de 4096 a 2048)
      - OLLAMA_PARALLELISM=1            # Reduce a 1 (solo 1 request a la vez)
    ports:
      - "11435:11435"
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          cpus: '1'                     # Limita proxy a 1 CPU
          memory: 512M                  # Limita proxy a 512MB
    restart: unless-stopped

volumes:
  ollama_data:
