[package]
name = "nexus-lite"
version = "0.2.1"
description = "NEXUS LITE - Asistente IA portable con control total del PC"
authors = ["HackTeck SPA <h.delgado@hackteck.cl>"]
edition = "2021"

[lib]
name = "nexus_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
ring = "0.17"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
hostname = "0.4"
whoami = "1.5"
dotenvy = "0.15"
futures-util = "0.3.32"
bytes = "1.11.1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
